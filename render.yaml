services:
  - type: web
    name: ai-copilot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false   # you'll paste this manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
